{% set name = "SALib" %}
{% set version = "1.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: da0eb0fdcc46662c00c5ab72b8557314eb524864aed712a4317c8f43562e9028

build:
  entry_points:
    - salib = SALib.scripts.salib:main
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - hatch-vcs
    - hatchling
  run:
    - python
    # The bug is in SALib/analyze/sobol.py: when Y.std() == 0 (constant output), dividing by zero produces NaN,
    # and first_order() returns a NaN array instead of a scalar. NumPy 2.4.x is stricter about assigning an array
    # into a scalar slot (S["S1"][j] = <array>), so it raises ValueError. Earlier NumPy 2.x versions silently coerced it.
    - numpy >=2.0
    - pandas >=2.0
    - scipy >=1.9.3
    - matplotlib-base >=3.5
    - multiprocess
  run_constrained:
    - pathos >=0.3.2

test:
  source_files:
    - tests
    - src/SALib/test_functions
    - pyproject.toml
  requires:
    - pip
    - pytest
  commands:
    - pip check
    # E AssertionError:
    # E Not equal to tolerance rtol=1e-07, atol=0.005
    - pytest -v --ignore=tests/test_discrepancy.py
  imports:
    - SALib

about:
  home: https://github.com/SALib/SALib
  dev_url: https://github.com/SALib/SALib
  doc_url: https://salib.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Sensitivity Analysis Library
  description: |
    Python implementations of commonly used sensitivity analysis methods.
    Useful in systems modeling to calculate the effects of model inputs or
    exogenous factors on outputs of interest.











extra:
  recipe-maintainers:
    - jschueller
    - willu47
    - ConnectedSystems
